name: Uuenda börsihinnad ja avalda leht

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 * * * *"   # iga tund
    # Järgmise päeva hinnad avaldatakse ~11:45 UTC; GitHub jätab tunniseid käivitusi
    # sageli vahele, seega lisakäivitused avaldamise järel
    - cron: "52 11 * * *"
    - cron: "12,27,42 12 * * *"
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lae börsihinnad (Elering)
        run: python3 scripts/fetch_prices.py
      - name: Lae ülekanded naabritega (Elering)
        continue-on-error: true
        run: python3 scripts/fetch_flows.py
      - name: Võta hinnaarhiiv (haru data)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: data
          path: _archive
      - name: Uuenda hinnaarhiivi ja hinnavahe statistikat
        continue-on-error: true
        run: |
          python3 scripts/update_history.py _archive .
          python3 scripts/update_futures.py data.json _archive/daily.csv || echo "::warning::futuuride uuendamine ebaõnnestus"
          python3 scripts/update_alexela.py data.json || echo "::warning::Alexela hinna uuendamine ebaõnnestus"
          cd _archive
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add daily.csv
            git commit -q -m "Hinnaarhiiv $(date -u +%F)"
            git push -q origin HEAD:data
          fi
          cd .. && rm -rf _archive
      - name: Salvesta data.json muudatused (futuurid, hinnavahe, Alexela)
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain data.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -q -m "Futuurid ja hinnavahe $(date -u +%F)"
            for i in 1 2 3; do
              git pull -q --rebase origin main && git push -q origin HEAD:main && break
              sleep 5
            done
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # GitHubi API viskab vahel "No artifacts named github-pages" – proovi uuesti
      - if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

name: Uuenda börsihinnad ja avalda leht

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 * * * *"   # iga tund
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Lae börsihinnad (Elering)
        run: python3 scripts/fetch_prices.py
      - name: Võta hinnaarhiiv (haru data)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: data
          path: _archive
      - name: Uuenda hinnaarhiivi ja hinnavahe statistikat
        continue-on-error: true
        run: |
          python3 scripts/update_history.py _archive .
          cd _archive
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add daily.csv
            git commit -q -m "Hinnaarhiiv $(date -u +%F)"
            git push -q origin HEAD:data
          fi
          cd .. && rm -rf _archive
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

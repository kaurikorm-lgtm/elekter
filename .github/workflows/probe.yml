name: probe
on:
  push:
    branches: [probe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          S=$(date -u -d '-3 hours' +%Y-%m-%dT%H:00:00.000Z); E=$(date -u -d '+30 hours' +%Y-%m-%dT%H:00:00.000Z)
          B=https://dashboard.elering.ee
          for p in "/v3/api-docs" "/api-docs" "/api/v3/api-docs"; do echo "== $p"; curl -s -m 30 "$B$p" | head -c 300; echo; done
          curl -s -m 30 "$B/v3/api-docs" -o docs.json; python3 -c "import json;d=json.load(open('docs.json'));[print(k) for k in d.get('paths',{})]" || true
          for p in "/api/transmission/cross-border?start=$S&end=$E" "/api/transmission/cross-border-planned?start=$S&end=$E" "/api/transmission/cross-border/latest" "/api/system/with-plan?start=$S&end=$E" "/api/system/latest"; do echo "== $p"; curl -s -m 30 "$B$p" | head -c 1500; echo; done

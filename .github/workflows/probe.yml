name: probe
on:
  push:
    branches: [probe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          S=$(date -u -d '-2 hours' +%Y-%m-%dT%H:00:00.000Z); E=$(date -u -d '+30 hours' +%Y-%m-%dT%H:00:00.000Z)
          B=https://dashboard.elering.ee
          curl -s -m 30 "$B/v3/api-docs" -o docs.json
          python3 - <<'PY'
          import json;d=json.load(open('docs.json'))
          for k in ['/api/transmission/cross-border-capacity/{group}','/api/transmission/cross-border-planned-trade','/api/transmission/cross-border/hourly','/api/transmission/cross-border']:
              print('##',k, json.dumps(d['paths'][k]['get'].get('parameters'))[:900]); print(d['paths'][k]['get'].get('description'))
          PY
          for g in finland latvia FI LV ee-fi; do echo "== cap $g"; curl -s -m 30 "$B/api/transmission/cross-border-capacity/$g?start=$S&end=$E" | head -c 700; echo; done
          echo "== cap"; curl -s -m 30 "$B/api/transmission/cross-border-capacity?start=$S&end=$E" | head -c 700; echo
          echo "== trade"; curl -s -m 30 "$B/api/transmission/cross-border-planned-trade?start=$S&end=$E" | head -c 1200; echo
          echo "== hourly"; curl -s -m 30 "$B/api/transmission/cross-border/hourly?start=$S&end=$E" | head -c 500; echo
